<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kidsempire_246 Store Manager</title>
<style>
:root{--pink:#f52b82;--lav:#8c6cff;--navy:#10182e;--cream:#fff8fb;--muted:#667085;--line:#e5e7eb}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--cream);color:var(--navy)}
a{text-decoration:none;color:inherit}.top{display:flex;justify-content:space-between;align-items:center;background:#10182e;color:#fff;padding:10px 20px;font-size:12px}.nav{background:rgba(255,255,255,.9);border-bottom:1px solid var(--line)}.navin{max-width:1200px;margin:0 auto;padding:18px 20px;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:900;letter-spacing:.04em;font-size:clamp(1.2rem,2vw,1.8rem)}.logo span{color:var(--pink)}.logo em{font-style:normal;color:var(--lav)}.admin-shell{max-width:1200px;margin:28px auto;padding:0 20px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.toolbar h1{margin:0}.btn{border:none;border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:700}.btn.primary{background:linear-gradient(135deg,#f52b82,#8c6cff);color:#fff}.btn.secondary{background:#eef2ff;color:#10182e}.layout{display:grid;grid-template-columns:420px 1fr;gap:20px}.panel{background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 12px 28px rgba(16,24,46,.04)}.panel h2{margin-top:0}.form-grid{display:grid;gap:12px}.field{display:flex;flex-direction:column;gap:8px;font-weight:700}.field input,.field select,.field textarea{padding:12px 14px;border:1px solid var(--line);border-radius:10px;font:inherit}.field textarea{min-height:90px;resize:vertical}.product-list{display:grid;gap:12px}.product-item{display:grid;grid-template-columns:74px 1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:16px;background:#fffafc}.thumb{width:74px;height:74px;border-radius:14px;background:linear-gradient(135deg,#fbe4ee,#ece3ff);display:grid;place-items:center;font-size:2rem}.meta h3{margin:0 0 6px;font-size:1.02rem}.small{font-size:.8rem;color:var(--muted)}.actions{display:flex;gap:8px}.mini{padding:8px 10px;border:none;border-radius:10px;cursor:pointer;font-weight:700}.mini.edit{background:#eef2ff;color:#10182e}.mini.delete{background:#fce7f3;color:#8f174d}.empty{padding:18px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);background:#fff}.notice{display:none;margin-bottom:16px;padding:12px 14px;border-radius:12px;background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0;font-weight:700}@media (max-width:860px){.layout{grid-template-columns:1fr}.toolbar,.navin{flex-wrap:wrap}.}
</style>
</head>
<body>
<div class="top"><span>🚚 Free shipping over $100 BDS</span><span>🇧🇧 Barbados Based</span></div>
<nav class="nav"><div class="navin"><a class="logo" href="#top"><span>KiDS</span>EMPIRE<em>_246</em> 👑</a><button class="btn secondary" onclick="logout()">Logout</button></div></nav>
<div class="admin-shell">
  <div class="toolbar"><h1>Store Manager</h1><button class="btn primary" onclick="resetForm()">Add New Product</button></div>
  <div id="notice" class="notice"></div>
  <div class="layout">
    <section class="panel">
      <h2 id="formTitle">Add Product</h2>
      <div class="form-grid">
        <div class="field"><label>Name</label><input id="productName" type="text" placeholder="Minnie Princess Dress"></div>
        <div class="field"><label>Category</label><select id="productCategory"><option>Kids Clothing</option><option>Accessories</option><option>New Arrivals</option><option>Boys Collection</option><option>Girls Collection</option></select></div>
        <div class="field"><label>Price (BDS)</label><input id="productPrice" type="number" min="0" step="0.01" value="45"></div>
        <div class="field"><label>Sizes</label><input id="productSizes" type="text" placeholder="4,6,8,10"></div>
        <div class="field"><label>Stock quantity</label><input id="productStock" type="number" min="0" value="20"></div>
        <div class="field"><label>Emoji / icon</label><input id="productEmoji" type="text" maxlength="2" value="👗" placeholder="👗"></div>
        <button class="btn primary" id="saveProduct">Save product</button>
      </div>
    </section>
    <section class="panel">
      <h2>Current Catalogue</h2>
      <div id="productList" class="product-list"></div>
    </section>
  </div>
</div>
<script>
const STORAGE_KEY='kidsempire_products_v2';
const ADMIN_OK='kidsempire_admin_ok';
if(localStorage.getItem(ADMIN_OK) !== '1'){ location.href='admin-panel.html'; }

const defaults = [
  {id:1,name:'Minnie Princess Dress',price:45,category:'Kids Clothing',sizes:['4','6','8','10'],stock:20,photo:'👗'},
  {id:2,name:'Safari Set',price:52,category:'Boys Collection',sizes:['4','6','8','10'],stock:12,photo:'🧢'},
  {id:3,name:'Pearl Accessory Set',price:24,category:'Accessories',sizes:['One Size'],stock:30,photo:'🎀'},
  {id:4,name:'Glow Bunny Tee',price:32,category:'New Arrivals',sizes:['4','6','8','10'],stock:18,photo:'✨'}
];

let products = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
if(!products.length){
  products = defaults;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
}

const productName = document.getElementById('productName');
const productCategory = document.getElementById('productCategory');
const productPrice = document.getElementById('productPrice');
const productSizes = document.getElementById('productSizes');
const productStock = document.getElementById('productStock');
const productEmoji = document.getElementById('productEmoji');
const productList = document.getElementById('productList');
const formTitle = document.getElementById('formTitle');
const notice = document.getElementById('notice');
let editingId = null;

function showNotice(msg){
  notice.textContent = msg;
  notice.style.display = 'block';
  setTimeout(()=>{ notice.style.display='none'; }, 2200);
}

function resetForm(){
  editingId = null;
  formTitle.textContent = 'Add Product';
  productName.value = '';
  productCategory.value = 'Kids Clothing';
  productPrice.value = '45';
  productSizes.value = '4,6,8,10';
  productStock.value = '20';
  productEmoji.value = '👗';
  document.getElementById('saveProduct').textContent = 'Save product';
}

function formatSizes(sizes){
  return Array.isArray(sizes) ? sizes.join(', ') : String(sizes || '');
}

function renderProducts(){
  productList.innerHTML = '';
  if(!products.length){
    productList.innerHTML = '<div class="empty">No products yet. Add your first product.</div>';
    return;
  }

  products.forEach(product => {
    const row = document.createElement('div');
    row.className = 'product-item';
    row.innerHTML = `
      <div class="thumb">${product.photo || '🛍️'}</div>
      <div class="meta">
        <h3>${product.name}</h3>
        <div class="small">${product.category} • $${Number(product.price).toFixed(2)} • Sizes: ${formatSizes(product.sizes)}</div>
        <div class="small">Stock: ${Number(product.stock || 0)}</div>
      </div>
      <div class="actions">
        <button class="mini edit" onclick="editProduct(${product.id})">Edit</button>
        <button class="mini delete" onclick="deleteProduct(${product.id})">Delete</button>
      </div>
    `;
    productList.appendChild(row);
  });
}

function saveProduct(){
  const name = productName.value.trim();
  const category = productCategory.value.trim();
  const price = Number(productPrice.value || 0);
  const stock = Number(productStock.value || 0);
  const photo = (productEmoji.value || '🛍️').trim() || '🛍️';
  const sizes = (productSizes.value || '').split(',').map(s => s.trim()).filter(Boolean);

  if(!name){
    showNotice('Please enter a product name.');
    return;
  }

  const payload = { name, category, price, sizes, stock, photo };

  if(editingId){
    products = products.map(product => product.id === editingId ? { ...product, ...payload } : product);
    showNotice('Product updated.');
  } else {
    const nextId = products.length ? Math.max(...products.map(p => Number(p.id) || 0)) + 1 : 1;
    products.push({ id: nextId, ...payload });
    showNotice('Product added.');
  }

  localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
  renderProducts();
  resetForm();
}

function editProduct(id){
  const product = products.find(item => item.id === id);
  if(!product) return;
  editingId = id;
  formTitle.textContent = 'Edit Product';
  productName.value = product.name || '';
  productCategory.value = product.category || 'Kids Clothing';
  productPrice.value = Number(product.price || 0);
  productSizes.value = formatSizes(product.sizes);
  productStock.value = Number(product.stock || 0);
  productEmoji.value = product.photo || '👗';
  document.getElementById('saveProduct').textContent = 'Update product';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function deleteProduct(id){
  const confirmDelete = confirm('Delete this product from the store?');
  if(!confirmDelete) return;
  products = products.filter(item => item.id !== id);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
  renderProducts();
  if(editingId === id){ resetForm(); }
  showNotice('Product removed.');
}

function logout(){
  localStorage.removeItem(ADMIN_OK);
  location.href='admin-panel.html';
}

document.getElementById('saveProduct').addEventListener('click', saveProduct);
renderProducts();
resetForm();
</script>
</body>
</html>
